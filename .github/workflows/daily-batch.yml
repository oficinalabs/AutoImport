# Batch do pipeline (docs/03-BACKEND.md): scrape (recência, com caps)
# → artefactos NDJSON → ingest+recompute na BD (scripts/pipeline/run-daily.ts).
#
# ⚠️ JÁ NÃO CORRE SOZINHO — só `workflow_dispatch` (manual). Duas razões:
#
#   1. A recolha passou a ser LOCAL: o `tools/collector/probe/collector-daemon.mjs` corre na
#      máquina do operador (watch contínuo + re-crawl --full em rotação) e alimenta uma
#      Postgres local; a Supabase de produção passa a receber só a montra publicada. A
#      recolha aqui ficou redundante.
#   2. Enquanto correu em cron, MENTIU: o secret DATABASE_URL nunca existiu no repositório,
#      o passo de ingest fazia `exit 0` com um aviso e o workflow reportava sucesso todos os
#      dias sem escrever uma linha na base de dados.
#
# Fica como ferramenta manual (replay/diagnóstico). Se um run manual chegar ao ingest sem
# DATABASE_URL, o job FALHA de propósito — vermelho honesto em vez de verde a mentir.
# Fora deste workflow (manuais): piscapisca (Python/Camoufox, correr local e
# ingerir o NDJSON), crawls --full profundos e o modo watch contínuo.
name: Daily batch

on:
  # Sem `schedule:` — ver cabeçalho. A recolha diária vive no daemon local.
  workflow_dispatch:
    inputs:
      source:
        description: "Correr só uma fonte (nome da entrada da matrix; vazio = todas)"
        required: false
        default: ""

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false # uma fonte a falhar não derruba o batch
      matrix:
        include:
          # ── Estrangeiro (recência-first, caps de páginas) ──
          - name: autoscout24-de
            cmd: node run-autoscout24.ts --country D --max-pages 10 --rate 1500
          - name: autoscout24-fr
            cmd: node run-autoscout24.ts --country F --max-pages 10 --rate 1500
          - name: autoscout24-be
            cmd: node run-autoscout24.ts --country B --max-pages 10 --rate 1500
          - name: autoscout24-nl
            cmd: node run-autoscout24.ts --country NL --max-pages 10 --rate 1500
          - name: autoscout24-es
            cmd: node run-autoscout24.ts --country E --max-pages 10 --rate 1500
          - name: autoboerse
            cmd: node run-autoboerse.ts --max-pages 10
          - name: meinauto
            cmd: node run-meinauto.ts --max-pages 10
          - name: autohero
            cmd: node run-autohero.ts --max-pages 10
          - name: aramisauto
            cmd: node run-aramisauto.ts --max-pages 10
          - name: ooyyo
            cmd: node run-ooyyo.ts --max-pages 3 # crawl-delay 30 s — páginas mínimas
          # ── Portugal (baseline de preço PT) ──
          - name: standvirtual
            cmd: node run-standvirtual.ts --max-pages 15
          - name: olxpt
            cmd: node run-olxpt.ts --max-pages 15
          - name: custojusto
            cmd: node run-custojusto.ts --max-pages 15
          - name: autosapo
            cmd: node run-autosapo.ts --max-pages 15
          - name: autopt
            cmd: node run-autopt.ts --max-pages 15
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event.inputs.source == '' || github.event.inputs.source == matrix.name }}

      - uses: actions/setup-node@v4
        if: ${{ github.event.inputs.source == '' || github.event.inputs.source == matrix.name }}
        with:
          node-version-file: .nvmrc

      - name: Recolher (${{ matrix.name }})
        if: ${{ github.event.inputs.source == '' || github.event.inputs.source == matrix.name }}
        continue-on-error: true # IPs de datacenter podem ser bloqueados — não é fatal
        working-directory: tools/collector
        run: ${{ matrix.cmd }}

      - name: Publicar NDJSON
        if: ${{ github.event.inputs.source == '' || github.event.inputs.source == matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: ndjson-${{ matrix.name }}
          path: tools/collector/out/
          if-no-files-found: ignore
          retention-days: 7

  ingest:
    runs-on: ubuntu-latest
    needs: scrape
    if: always()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Juntar artefactos NDJSON
        uses: actions/download-artifact@v4
        with:
          pattern: ndjson-*
          path: tools/collector/out/
          merge-multiple: true

      - name: Pipeline diário (ingest → match → mercado PT → custos → oportunidades → alertas)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Emails dos alertas (passo 10/10). Sem a chave, o lib/email.ts avisa
          # nos logs e segue — o pipeline não falha, mas ninguém recebe nada.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || 'noreply@arestadigital.pt' }}
          # Base dos links "Ver anúncio" no email e no sino.
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || 'https://autoimport.arestadigital.pt' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::secret DATABASE_URL ausente — não há para onde ingerir. Os NDJSON ficam nos artefactos (7 dias); a ingestão é local (pnpm pipeline:ingest --dir <out>). Se este run era mesmo para escrever na BD, define o secret."
            exit 1
          fi
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::secret RESEND_API_KEY ausente — os alertas criam a notificação no sino mas NÃO enviam email."
          fi
          # `pnpm pipeline:daily`, não `tsx …/run-daily.ts`: o script do
          # package.json passa TSX_TSCONFIG_PATH=tsconfig.scripts.json, sem o
          # qual o email do alerta rebenta com "React is not defined" — só em
          # runtime, e só no envio (ver docs/09).
          pnpm pipeline:daily
